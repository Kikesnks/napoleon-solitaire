<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Opt-out del Auto-Dark de Chrome Android: declaramos que la página
         está pensada SOLO para modo claro, así Chrome no invierte colores
         cuando el sistema está en modo oscuro. El valor válido para meta es
         simplemente `light` (la palabra `only` es exclusiva de CSS). -->
    <meta name="color-scheme" content="light" />
    <title>Solitario Napoleón</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
